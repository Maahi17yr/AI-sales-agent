name: Naija Bites chat safety checks

on:
  push:
    branches:
      - main
      - fix/account-chat-sync-preview-20261030
  pull_request:
    branches:
      - main
      - feature/owner-mode-phase1-auth

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test authentication, owner access, customer isolation, and chat persistence
        run: python -m unittest scripts.test_auth_api scripts.test_owner_auth scripts.test_owner_dashboard -v

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build production frontend
        env:
          NEXT_BACKEND_URL: https://naija-bites-demo-api.onrender.com
          NEXT_PUBLIC_DEMO_MODE: 'true'
        run: npm run build

  owner-staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NAIJA_BITES_ENV: development
      NAIJA_BITES_DATA_DIR: ${{ runner.temp }}/naija-bites-owner-smoke
      NEXT_BACKEND_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: cd frontend && npm ci
      - name: Start disposable local backend and frontend
        run: |
          mkdir -p "$NAIJA_BITES_DATA_DIR"
          python -m data.database.models
          python -m uvicorn core.api.server:app --host 127.0.0.1 --port 8000 > /tmp/owner-backend.log 2>&1 &
          (cd frontend && npm run dev -- --hostname 127.0.0.1) > /tmp/owner-frontend.log 2>&1 &
      - name: Smoke test customer and owner journeys through Next.js proxy
        run: python scripts/test_owner_staging_smoke.py
      - name: Show server logs on failure
        if: failure()
        run: |
          tail -100 /tmp/owner-backend.log || true
          tail -100 /tmp/owner-frontend.log || true
