name: Owner AI isolated real Bedrock smoke

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - 'scripts/test_owner_ai_live_bedrock.py'
      - '.github/workflows/owner-ai-live.yml'

permissions:
  contents: read

concurrency:
  group: owner-ai-bedrock-one-shot-pr-80
  cancel-in-progress: false

jobs:
  owner-ai-live:
    if: github.event.pull_request.number == 80 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NAIJA_BITES_ENV: development
      DATABASE_URL: ''
      NAIJA_BITES_DATA_DIR: /tmp/naija-bites-owner-ai-bedrock-disposable
      AWS_MAX_ATTEMPTS: '1'
      AWS_RETRY_MODE: standard
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Gate single explicitly approved live test commit
        id: approved
        shell: bash
        run: |
          if git log -1 --format=%s | grep -qF '[owner-ai-live-approved]'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No approved live inference marker; chargeable test skipped"
          fi
      - uses: actions/setup-python@v5
        if: steps.approved.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        if: steps.approved.outputs.run == 'true'
        run: python -m pip install -r requirements.txt
      - name: Check ephemeral test boundary and staging credentials
        if: steps.approved.outputs.run == 'true'
        env:
          BEDROCK_MODEL_ID: ${{ secrets.STAGE1_BEDROCK_MODEL_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STAGE1_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGE1_AWS_SECRET_ACCESS_KEY }}
        run: |
          test -z "$DATABASE_URL"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$BEDROCK_MODEL_ID"
      - name: Execute one real Owner AI Bedrock inference on disposable fictional SQLite
        if: steps.approved.outputs.run == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STAGE1_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGE1_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.STAGE1_AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.STAGE1_AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ secrets.STAGE1_AWS_REGION }}
          BEDROCK_MODEL_ID: ${{ secrets.STAGE1_BEDROCK_MODEL_ID }}
        run: python -m scripts.test_owner_ai_live_bedrock
