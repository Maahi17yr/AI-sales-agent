name: Owner AI AWS secret authentication diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/owner-ai-aws-auth.yml'

permissions:
  contents: read

concurrency:
  group: owner-ai-aws-auth-pr-80
  cancel-in-progress: false

jobs:
  aws-identity-diagnostic:
    if: github.event.pull_request.number == 80 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.STAGE1_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGE1_AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.STAGE1_AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: ${{ secrets.STAGE1_AWS_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_MAX_ATTEMPTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Guard one authorized diagnostic
        id: authorized
        run: |
          if git log -1 --format=%s | grep -qF '[owner-ai-sts-approved]'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.authorized.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install minimal AWS client
        if: steps.authorized.outputs.run == 'true'
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Check AWS credentials through STS only (no Bedrock / database)
        if: steps.authorized.outputs.run == 'true'
        run: |
          python - <<'PY'
          import os
          import sys
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError, BotoCoreError
          key = os.environ.get("AWS_ACCESS_KEY_ID", "")
          secret = os.environ.get("AWS_SECRET_ACCESS_KEY", "")
          token = os.environ.get("AWS_SESSION_TOKEN", "")
          print("AWS access key configured:", bool(key))
          print("AWS secret access key configured:", bool(secret))
          print("AWS session token configured:", bool(token))
          print("Temporary AWS key type:", key.startswith("ASIA"))
          if not key or not secret:
              sys.exit("DIAGNOSTIC: missing AWS secret configuration")
          if key.startswith("ASIA") and not token:
              sys.exit("DIAGNOSTIC: temporary AWS key needs an AWS session token")
          try:
              client = boto3.client("sts", config=Config(
                  connect_timeout=5, read_timeout=15,
                  retries={"mode": "standard", "max_attempts": 1}
              ))
              client.get_caller_identity()
              print("DIAGNOSTIC: AWS_STS_AUTHENTICATED")
          except ClientError as exc:
              code = exc.response.get("Error", {}).get("Code", "UnknownAWSClientError")
              print("DIAGNOSTIC: AWS_STS_REJECTED, error code:", code)
              sys.exit(1)
          except (BotoCoreError, OSError) as exc:
              print("DIAGNOSTIC: AWS_STS_UNAVAILABLE:", type(exc).__name__)
              sys.exit(1)
          PY
